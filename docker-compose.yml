services:
  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile_booking_service
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile_worker
    env_file: .env
    depends_on:
      - api

  migrate:
      build:
        context: .
        dockerfile: dockerfiles/Dockerfile_alembic
      command: alembic upgrade head
      env_file: .env
      depends_on:
        db:
          condition: service_healthy

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: